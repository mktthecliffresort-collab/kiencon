    <script>
      // Safeguard against environment/wrapper scripts assigning to read-only window.fetch getter
      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : null);
          if (target && target.fetch) {
            var currentFetch = target.fetch.bind(target);
            var descriptor = {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = typeof fn === 'function' ? fn.bind(target) : fn;
              },
              configurable: true,
              enumerable: true,
            };
            try {
              Object.defineProperty(target, 'fetch', descriptor);
            } catch (err) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', descriptor);
              } catch (err) {}
            }
          }
        } catch (e) {
          // Fallback gracefully
        }
      })();
    </script>
